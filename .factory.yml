# How the software factory (github.com/giova333/software-factory) works on this repo.
# Read from the default branch only, so a PR can't change it for its own run.
harness: claude-code
model: claude-sonnet-5-5
allowed_users: [giova333]   # who may trigger it (overridden by the workflow input or FACTORY_ALLOWED_USERS)
skills: []                  # e.g. github:mattpocock/skills@<40-char-sha>#skills/engineering/tdd
setup: mvn -B -q dependency:go-offline
test: mvn -B -q test        # compiles everything and runs tests under src/test/java
limits:
  timeout_minutes: 30
  max_turns: 60
